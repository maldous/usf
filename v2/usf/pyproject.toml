[project]
name = "usf"
version = "0.0.0"
description = "USF v2 graph-authority replacement project (scaffold; no semantic content yet)"
requires-python = ">=3.11"
dependencies = [
  "rdflib",
  "pyshacl",
  "requests",
  "httpx",
  "pydantic",
  "pyyaml",
  "click",
  "pytest",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["compiler"]
