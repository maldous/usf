<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">USF governed foundation overview</title>
  <desc id="desc">A marketecture diagram showing semantics, ADRs, validators, proof evidence and implementation as a governed foundation for enterprise services and AI-assisted delivery.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.22"/>
    </filter>
    <style>
      .title{font:700 42px Arial, Helvetica, sans-serif;fill:#f8fafc}.sub{font:400 21px Arial, Helvetica, sans-serif;fill:#cbd5e1}.box{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2;rx:22;filter:url(#shadow)}.boxTitle{font:700 22px Arial, Helvetica, sans-serif;fill:#0f172a}.boxText{font:400 17px Arial, Helvetica, sans-serif;fill:#334155}.pill{fill:#e0f2fe;stroke:#38bdf8;stroke-width:2;rx:18}.pillText{font:700 16px Arial, Helvetica, sans-serif;fill:#075985}.arrow{stroke:#7dd3fc;stroke-width:5;marker-end:url(#arrowhead)}.label{font:700 15px Arial, Helvetica, sans-serif;fill:#e0f2fe}
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L12,4 L0,8 Z" fill="#7dd3fc"/>
    </marker>
  </defs>
  <rect width="1200" height="520" fill="url(#bg)" rx="28"/>
  <text x="60" y="76" class="title">Universal Service Foundation</text>
  <text x="60" y="112" class="sub">A governed enterprise substrate where people and AI build from semantics, evidence and contracts.</text>

  <rect x="70" y="180" width="235" height="150" class="box"/>
  <text x="95" y="222" class="boxTitle">Define truth</text>
  <text x="95" y="258" class="boxText">Semantic contracts</text>
  <text x="95" y="286" class="boxText">Capability facets</text>
  <text x="95" y="314" class="boxText">Environment policy</text>

  <line x1="315" y1="255" x2="405" y2="255" class="arrow"/>
  <text x="323" y="235" class="label">constrain</text>

  <rect x="420" y="155" width="360" height="200" class="box"/>
  <text x="455" y="197" class="boxTitle">Governed foundation layer</text>
  <rect x="455" y="220" width="135" height="36" class="pill"/><text x="477" y="244" class="pillText">ADRs</text>
  <rect x="610" y="220" width="135" height="36" class="pill"/><text x="632" y="244" class="pillText">Validators</text>
  <rect x="455" y="274" width="135" height="36" class="pill"/><text x="477" y="298" class="pillText">Proof</text>
  <rect x="610" y="274" width="135" height="36" class="pill"/><text x="630" y="298" class="pillText">Lineage</text>
  <text x="455" y="336" class="boxText">Drift becomes visible before it becomes architecture.</text>

  <line x1="790" y1="255" x2="880" y2="255" class="arrow"/>
  <text x="799" y="235" class="label">license</text>

  <rect x="895" y="180" width="235" height="150" class="box"/>
  <text x="920" y="222" class="boxTitle">Deliver services</text>
  <text x="920" y="258" class="boxText">Apps and packages</text>
  <text x="920" y="286" class="boxText">Provider adapters</text>
  <text x="920" y="314" class="boxText">Operational evidence</text>

  <path d="M1015 352 C1015 430 185 430 185 352" fill="none" stroke="#38bdf8" stroke-width="4" stroke-dasharray="10 10" marker-end="url(#arrowhead)"/>
  <text x="420" y="455" class="sub">Evidence feeds decisions. Decisions preserve intent. Validators keep the system honest.</text>
</svg>
