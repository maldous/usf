<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">USF authority stack</title>
  <desc id="desc">A ranked stack showing that semantics outrank ADRs, validators, proof evidence, implementation, historical evidence and generated reports.</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.title{font:700 36px Arial, Helvetica, sans-serif;fill:#0f172a}.sub{font:400 19px Arial, Helvetica, sans-serif;fill:#475569}.rank{font:700 18px Arial, Helvetica, sans-serif;fill:#ffffff}.name{font:700 22px Arial, Helvetica, sans-serif;fill:#0f172a}.desc{font:400 16px Arial, Helvetica, sans-serif;fill:#334155}.layer{stroke:#cbd5e1;stroke-width:2;rx:18}.badge{fill:#0f172a;rx:16}.note{font:700 17px Arial, Helvetica, sans-serif;fill:#075985}.arrow{stroke:#0284c7;stroke-width:4;marker-end:url(#arrowhead)}
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto"><path d="M0,0 L12,4 L0,8 Z" fill="#0284c7"/></marker>
  </defs>
  <rect width="1100" height="620" class="bg" rx="28"/>
  <text x="55" y="62" class="title">Authority beats recency</text>
  <text x="55" y="94" class="sub">When artefacts disagree, USF resolves change by governed authority, not by whichever file changed last.</text>

  <g transform="translate(110 135)">
    <rect y="0" width="880" height="54" class="layer" fill="#bae6fd"/><rect x="18" y="12" width="76" height="30" class="badge"/><text x="42" y="33" class="rank">1</text><text x="118" y="34" class="name">Semantic definitions</text><text x="420" y="34" class="desc">intended behaviour and contracts</text>
    <rect y="64" width="880" height="54" class="layer" fill="#dbeafe"/><rect x="18" y="76" width="76" height="30" class="badge"/><text x="42" y="97" class="rank">2</text><text x="118" y="98" class="name">ADRs</text><text x="420" y="98" class="desc">permitted, forbidden and why</text>
    <rect y="128" width="880" height="54" class="layer" fill="#e0e7ff"/><rect x="18" y="140" width="76" height="30" class="badge"/><text x="42" y="161" class="rank">3</text><text x="118" y="162" class="name">Validator rules</text><text x="420" y="162" class="desc">consistency and admissibility</text>
    <rect y="192" width="880" height="54" class="layer" fill="#f0f9ff"/><rect x="18" y="204" width="76" height="30" class="badge"/><text x="42" y="225" class="rank">4</text><text x="118" y="226" class="name">Runtime proof evidence</text><text x="420" y="226" class="desc">what was exercised, where and how fresh</text>
    <rect y="256" width="880" height="54" class="layer" fill="#f1f5f9"/><rect x="18" y="268" width="76" height="30" class="badge"/><text x="42" y="289" class="rank">5</text><text x="118" y="290" class="name">Source implementation</text><text x="420" y="290" class="desc">what the code currently does</text>
    <rect y="320" width="880" height="54" class="layer" fill="#f8fafc"/><rect x="18" y="332" width="76" height="30" class="badge"/><text x="42" y="353" class="rank">6</text><text x="118" y="354" class="name">Historical evidence</text><text x="420" y="354" class="desc">prior intent and operational knowledge</text>
    <rect y="384" width="880" height="54" class="layer" fill="#ffffff"/><rect x="18" y="396" width="76" height="30" class="badge"/><text x="42" y="417" class="rank">7</text><text x="118" y="418" class="name">Generated reports</text><text x="420" y="418" class="desc">summaries, never source of truth</text>
  </g>
  <line x1="1010" y1="160" x2="1010" y2="520" class="arrow"/>
  <text x="790" y="555" class="note">Higher ranks define and constrain. Lower ranks implement, evidence and summarize.</text>
</svg>
