<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" role="img" aria-label="USF capability domains">
  <defs>
    <linearGradient id="cbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#0a0f1f"/>
    </linearGradient>
    <style>
      text{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#e2e8f0;}
      .h{font-size:30px;font-weight:800;}
      .sub{font-size:17px;fill:#94a3b8;}
      .ct{font-size:19px;font-weight:700;}
      .cd{font-size:13px;fill:#94a3b8;}
    </style>
  </defs>
  <rect width="1280" height="560" rx="18" fill="url(#cbg)"/>
  <text x="60" y="66" class="h">A complete platform surface, governed as one operating model</text>
  <text x="60" y="96" class="sub">Identity, tenancy, data, workflow, observability and operations — the platform tax every enterprise pays, delivered once.</text>

  <g transform="translate(60,128)">
    <!-- 4 cols x 3 rows -->
    <g>
      <g transform="translate(0,0)"><rect width="278" height="118" rx="12" fill="#0e1730" stroke="#38bdf8" stroke-opacity="0.35"/><text x="20" y="40" class="ct">Identity &amp; Access</text><text x="20" y="68" class="cd">SSO, MFA, RBAC, tenant roles,</text><text x="20" y="88" class="cd">privileged access, break-glass.</text></g>
      <g transform="translate(294,0)"><rect width="278" height="118" rx="12" fill="#0e1730" stroke="#818cf8" stroke-opacity="0.35"/><text x="20" y="40" class="ct">Multi-Tenancy</text><text x="20" y="68" class="cd">Tenant isolation, data</text><text x="20" y="88" class="cd">boundaries, row-level scoping.</text></g>
      <g transform="translate(588,0)"><rect width="278" height="118" rx="12" fill="#0e1730" stroke="#a78bfa" stroke-opacity="0.35"/><text x="20" y="40" class="ct">Authorization</text><text x="20" y="68" class="cd">Permission contracts, policy</text><text x="20" y="88" class="cd">governance, decision points.</text></g>
      <g transform="translate(882,0)"><rect width="278" height="118" rx="12" fill="#0e1730" stroke="#34d399" stroke-opacity="0.35"/><text x="20" y="40" class="ct">Audit &amp; Evidence</text><text x="20" y="68" class="cd">Tamper-evident trails,</text><text x="20" y="88" class="cd">retention, chain of custody.</text></g>
    </g>
    <g transform="translate(0,134)">
      <g transform="translate(0,0)"><rect width="278" height="118" rx="12" fill="#0e1730" stroke="#38bdf8" stroke-opacity="0.35"/><text x="20" y="40" class="ct">Files &amp; Storage</text><text x="20" y="68" class="cd">Object storage, uploads,</text><text x="20" y="88" class="cd">bulk data, lifecycle.</text></g>
      <g transform="translate(294,0)"><rect width="278" height="118" rx="12" fill="#0e1730" stroke="#818cf8" stroke-opacity="0.35"/><text x="20" y="40" class="ct">Workflow &amp; Jobs</text><text x="20" y="68" class="cd">Durable workflows, async</text><text x="20" y="88" class="cd">jobs, notifications.</text></g>
      <g transform="translate(588,0)"><rect width="278" height="118" rx="12" fill="#0e1730" stroke="#a78bfa" stroke-opacity="0.35"/><text x="20" y="40" class="ct">Search &amp; Indexing</text><text x="20" y="68" class="cd">Product search, indexing,</text><text x="20" y="88" class="cd">query semantics.</text></g>
      <g transform="translate(882,0)"><rect width="278" height="118" rx="12" fill="#0e1730" stroke="#34d399" stroke-opacity="0.35"/><text x="20" y="40" class="ct">Observability</text><text x="20" y="68" class="cd">Metrics, logs, traces,</text><text x="20" y="88" class="cd">alerts, browser telemetry.</text></g>
    </g>
    <g transform="translate(0,268)">
      <g transform="translate(0,0)"><rect width="278" height="118" rx="12" fill="#0e1730" stroke="#38bdf8" stroke-opacity="0.35"/><text x="20" y="40" class="ct">Config &amp; Secrets</text><text x="20" y="68" class="cd">Typed configuration, secret</text><text x="20" y="88" class="cd">references, crypto lifecycle.</text></g>
      <g transform="translate(294,0)"><rect width="278" height="118" rx="12" fill="#0e1730" stroke="#818cf8" stroke-opacity="0.35"/><text x="20" y="40" class="ct">Data Lifecycle</text><text x="20" y="68" class="cd">Migrations, backup, restore,</text><text x="20" y="88" class="cd">DR, privacy &amp; retention.</text></g>
      <g transform="translate(588,0)"><rect width="278" height="118" rx="12" fill="#0e1730" stroke="#a78bfa" stroke-opacity="0.35"/><text x="20" y="40" class="ct">Provider Adapters</text><text x="20" y="68" class="cd">Ports &amp; adapters, provider</text><text x="20" y="88" class="cd">modes, portability.</text></g>
      <g transform="translate(882,0)"><rect width="278" height="118" rx="12" fill="#0e1730" stroke="#34d399" stroke-opacity="0.35"/><text x="20" y="40" class="ct">Operations</text><text x="20" y="68" class="cd">Environment policy, resilience,</text><text x="20" y="88" class="cd">rate limiting, runbooks.</text></g>
    </g>
  </g>
</svg>
