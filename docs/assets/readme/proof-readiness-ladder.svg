<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
  <title id="title">USF proof readiness ladder</title>
  <desc id="desc">A proof ladder showing evidence rising from discovery to foundation while keeping hermetic, local, sandbox and live provider modes honest.</desc>
  <defs>
    <style>
      .bg{fill:#0b1220}.title{font:700 36px Arial, Helvetica, sans-serif;fill:#f8fafc}.sub{font:400 19px Arial, Helvetica, sans-serif;fill:#cbd5e1}.step{fill:#f8fafc;stroke:#38bdf8;stroke-width:2;rx:16}.stepTitle{font:700 18px Arial, Helvetica, sans-serif;fill:#0f172a}.stepText{font:400 14px Arial, Helvetica, sans-serif;fill:#475569}.mode{font:700 15px Arial, Helvetica, sans-serif;fill:#e0f2fe}.guard{fill:#1e293b;stroke:#fbbf24;stroke-width:2;rx:18}.guardText{font:700 17px Arial, Helvetica, sans-serif;fill:#fef3c7}.arrow{stroke:#7dd3fc;stroke-width:4;marker-end:url(#arrowhead)}
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto"><path d="M0,0 L12,4 L0,8 Z" fill="#7dd3fc"/></marker>
  </defs>
  <rect width="1100" height="560" class="bg" rx="28"/>
  <text x="55" y="62" class="title">Proof is evidence, not theatre</text>
  <text x="55" y="94" class="sub">USF records what was exercised, on which substrate, at which observed level, and whether the claim is fresh.</text>

  <g transform="translate(70 150)">
    <rect x="0" y="280" width="126" height="70" class="step"/><text x="22" y="306" class="stepTitle">L0</text><text x="22" y="330" class="stepText">Discovery</text>
    <rect x="135" y="240" width="126" height="110" class="step"/><text x="157" y="270" class="stepTitle">L1</text><text x="157" y="294" class="stepText">Executable</text>
    <rect x="270" y="200" width="126" height="150" class="step"/><text x="292" y="230" class="stepTitle">L2</text><text x="292" y="254" class="stepText">Contract</text>
    <rect x="405" y="160" width="126" height="190" class="step"/><text x="427" y="190" class="stepTitle">L3</text><text x="427" y="214" class="stepText">Behaviour</text>
    <rect x="540" y="120" width="126" height="230" class="step"/><text x="562" y="150" class="stepTitle">L4</text><text x="562" y="174" class="stepText">Substrate</text>
    <rect x="675" y="80" width="126" height="270" class="step"/><text x="697" y="110" class="stepTitle">L5</text><text x="697" y="134" class="stepText">Resilience</text>
    <rect x="810" y="40" width="126" height="310" class="step"/><text x="832" y="70" class="stepTitle">L6</text><text x="832" y="94" class="stepText">Foundation</text>
    <line x1="62" y1="260" x2="860" y2="40" class="arrow"/>
  </g>

  <text x="90" y="535" class="mode">Provider modes remain explicit: hermetic → composed-local → sandbox-external → live-external</text>
  <rect x="625" y="390" width="395" height="88" class="guard"/>
  <text x="655" y="423" class="guardText">No overclaiming</text>
  <text x="655" y="452" class="guardText">Hermetic proof never masquerades as live-provider evidence.</text>
</svg>
