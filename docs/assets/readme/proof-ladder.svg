<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 470" role="img" aria-label="USF proof ladder and provider modes">
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#0a0f1f"/>
    </linearGradient>
    <linearGradient id="step" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0e2a3f"/><stop offset="1" stop-color="#122e33"/>
    </linearGradient>
    <style>
      text{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#e2e8f0;}
      .h{font-size:30px;font-weight:800;}
      .sub{font-size:17px;fill:#94a3b8;}
      .st{font-size:18px;font-weight:700;}
      .sd{font-size:13px;fill:#94a3b8;}
      .tag{font-size:13px;font-weight:700;fill:#0b1020;}
    </style>
  </defs>
  <rect width="1280" height="470" rx="18" fill="url(#pbg)"/>
  <text x="60" y="66" class="h">Readiness you can audit — never a claim that outranks its evidence</text>
  <text x="60" y="96" class="sub">Provider mode and environment are separate dimensions. A claim is admissible only when the observed proof level matches it.</text>

  <!-- ascending steps -->
  <g transform="translate(60,150)">
    <g transform="translate(0,210)"><rect width="270" height="80" rx="10" fill="url(#step)" stroke="#38bdf8" stroke-opacity="0.4"/><text x="18" y="34" class="st">Hermetic</text><text x="18" y="60" class="sd">In-memory + mock IdP. Deterministic, offline.</text></g>
    <g transform="translate(295,140)"><rect width="270" height="80" rx="10" fill="url(#step)" stroke="#818cf8" stroke-opacity="0.4"/><text x="18" y="34" class="st">Composed-local</text><text x="18" y="60" class="sd">Real services via Docker Compose.</text></g>
    <g transform="translate(590,70)"><rect width="270" height="80" rx="10" fill="url(#step)" stroke="#a78bfa" stroke-opacity="0.4"/><text x="18" y="34" class="st">Sandbox-external</text><text x="18" y="60" class="sd">Provider sandboxes, bounded scope.</text></g>
    <g transform="translate(885,0)"><rect width="270" height="80" rx="10" fill="url(#step)" stroke="#34d399" stroke-opacity="0.5"/><text x="18" y="34" class="st">Live-external</text><text x="18" y="60" class="sd">Live providers — an addition, never a replacement.</text></g>
    <!-- connecting arrow -->
    <path d="M20 200 L1120 -6" stroke="#334155" stroke-width="2" stroke-dasharray="5 6" opacity="0.6"/>
  </g>

  <g transform="translate(60,120)">
    <rect x="0" y="0" width="150" height="26" rx="13" fill="#38bdf8"/><text x="18" y="18" class="tag">FAIL CLOSED</text>
    <rect x="162" y="0" width="196" height="26" rx="13" fill="#34d399"/><text x="180" y="18" class="tag">STALE ≠ PASS</text>
    <rect x="370" y="0" width="300" height="26" rx="13" fill="#a78bfa"/><text x="388" y="18" class="tag">HERMETIC ≠ LIVE-PROVIDER</text>
  </g>
</svg>
