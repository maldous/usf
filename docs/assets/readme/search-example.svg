<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" role="img" aria-label="Worked example: tenant product search capability composition">
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#0a0f1f"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0ea5e9"/><stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <radialGradient id="sglow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.22"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#475569"/></marker>
    <style>
      text{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#e2e8f0;}
      .h{font-size:29px;font-weight:800;}
      .sub{font-size:16px;fill:#94a3b8;}
      .band{font-size:13px;font-weight:800;letter-spacing:1.5px;fill:#64748b;}
      .core1{font-size:21px;font-weight:800;fill:#f8fafc;}
      .core2{font-size:13px;fill:#dbeafe;}
      .cap{font-size:15px;font-weight:700;}
      .capd{font-size:11.5px;fill:#94a3b8;}
      .svc{font-size:15px;font-weight:700;}
      .svcd{font-size:11.5px;fill:#94a3b8;}
      .port{font-size:13px;font-weight:700;fill:#0b1020;}
    </style>
  </defs>
  <rect width="1280" height="760" rx="18" fill="url(#sbg)"/>
  <circle cx="640" cy="250" r="360" fill="url(#sglow)"/>
  <text x="60" y="60" class="h">Worked example — one search query, formally composed</text>
  <text x="60" y="88" class="sub">"Return the documents in my tenant that match this query, and only the ones I'm entitled to see."</text>

  <!-- capability band -->
  <text x="60" y="128" class="band">CAPABILITIES IT INHERITS FROM</text>
  <g>
    <!-- sibling capability cards -->
    <g transform="translate(60,142)"><rect width="210" height="72" rx="10" fill="#0e1730" stroke="#38bdf8" stroke-opacity="0.4"/><text x="16" y="30" class="cap">Identity &amp; Membership</text><text x="16" y="52" class="capd">who is asking; which tenant</text></g>
    <g transform="translate(285,142)"><rect width="210" height="72" rx="10" fill="#0e1730" stroke="#818cf8" stroke-opacity="0.4"/><text x="16" y="30" class="cap">Relational Storage + RLS</text><text x="16" y="52" class="capd">the canonical isolation predicate</text></g>
    <g transform="translate(510,142)"><rect width="210" height="72" rx="10" fill="#0e1730" stroke="#a78bfa" stroke-opacity="0.4"/><text x="16" y="30" class="cap">RBAC &amp; Permissions</text><text x="16" y="52" class="capd">per-document permission key</text></g>
    <g transform="translate(735,142)"><rect width="210" height="72" rx="10" fill="#0e1730" stroke="#34d399" stroke-opacity="0.4"/><text x="16" y="30" class="cap">Object Storage</text><text x="16" y="52" class="capd">tenant-prefixed documents</text></g>
    <g transform="translate(960,142)"><rect width="260" height="72" rx="10" fill="#0e1730" stroke="#f59e0b" stroke-opacity="0.4"/><text x="16" y="30" class="cap">Audit + Observability</text><text x="16" y="52" class="capd">privileged-action trail; traces</text></g>
  </g>

  <!-- core capability -->
  <g transform="translate(430,268)">
    <rect width="420" height="104" rx="16" fill="url(#core)"/>
    <text x="210" y="42" text-anchor="middle" class="core1">Product Search capability</text>
    <text x="210" y="68" text-anchor="middle" class="core2">semantic-contract.search-and-indexing-product-search</text>
    <text x="210" y="88" text-anchor="middle" class="core2">10 facets · tenant query + admin reindex</text>
  </g>
  <!-- arrows from capabilities down into core -->
  <g stroke="#475569" stroke-width="1.6" fill="none" opacity="0.8">
    <path d="M165 214 C 260 250, 430 250, 470 266" marker-end="url(#arw)"/>
    <path d="M390 214 C 470 240, 520 244, 545 266" marker-end="url(#arw)"/>
    <path d="M615 214 L 640 266" marker-end="url(#arw)"/>
    <path d="M840 214 C 800 240, 760 246, 735 266" marker-end="url(#arw)"/>
    <path d="M1090 214 C 980 250, 840 252, 800 266" marker-end="url(#arw)"/>
  </g>

  <!-- port boundary -->
  <g transform="translate(430,392)">
    <rect width="420" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.5"/>
    <text x="210" y="23" text-anchor="middle" class="port">search repository / query port · full-text adapter</text>
  </g>
  <path d="M640 372 L640 392" stroke="#475569" stroke-width="1.6" marker-end="url(#arw)"/>

  <!-- services band -->
  <text x="60" y="486" class="band">COMPOSED SERVICES THAT RUN IT</text>
  <g>
    <g transform="translate(60,500)"><rect width="182" height="86" rx="10" fill="#10233a" stroke="#38bdf8" stroke-opacity="0.45"/><text x="16" y="32" class="svc">Meilisearch</text><text x="16" y="54" class="svcd">full-text adapter</text><text x="16" y="72" class="svcd">index + query</text></g>
    <g transform="translate(258,500)"><rect width="182" height="86" rx="10" fill="#10233a" stroke="#818cf8" stroke-opacity="0.45"/><text x="16" y="32" class="svc">Postgres</text><text x="16" y="54" class="svcd">source of truth</text><text x="16" y="72" class="svcd">RLS predicate</text></g>
    <g transform="translate(456,500)"><rect width="182" height="86" rx="10" fill="#10233a" stroke="#a78bfa" stroke-opacity="0.45"/><text x="16" y="32" class="svc">Keycloak</text><text x="16" y="54" class="svcd">identity / tenant</text><text x="16" y="72" class="svcd">membership</text></g>
    <g transform="translate(654,500)"><rect width="182" height="86" rx="10" fill="#10233a" stroke="#34d399" stroke-opacity="0.45"/><text x="16" y="32" class="svc">MinIO</text><text x="16" y="54" class="svcd">tenant-prefixed</text><text x="16" y="72" class="svcd">documents</text></g>
    <g transform="translate(852,500)"><rect width="182" height="86" rx="10" fill="#10233a" stroke="#f59e0b" stroke-opacity="0.45"/><text x="16" y="32" class="svc">Loki · Tempo</text><text x="16" y="54" class="svcd">Grafana</text><text x="16" y="72" class="svcd">trail · trace · view</text></g>
    <g transform="translate(1050,500)"><rect width="170" height="86" rx="10" fill="#10233a" stroke="#f472b6" stroke-opacity="0.45"/><text x="16" y="32" class="svc">OpenBao</text><text x="16" y="54" class="svcd">secret references,</text><text x="16" y="72" class="svcd">never values</text></g>
  </g>
  <g stroke="#475569" stroke-width="1.6" fill="none" opacity="0.75">
    <path d="M560 426 C 400 456, 200 470, 151 500" marker-end="url(#arw)"/>
    <path d="M600 426 C 480 460, 360 472, 349 500" marker-end="url(#arw)"/>
    <path d="M640 426 L 547 500" marker-end="url(#arw)"/>
    <path d="M680 426 C 720 462, 740 474, 745 500" marker-end="url(#arw)"/>
    <path d="M720 426 C 840 458, 920 472, 943 500" marker-end="url(#arw)"/>
    <path d="M740 426 C 940 456, 1080 472, 1135 500" marker-end="url(#arw)"/>
  </g>

  <!-- proof footer -->
  <g transform="translate(60,624)">
    <rect width="1160" height="104" rx="12" fill="#0e1730" stroke="#1e293b"/>
    <text x="24" y="40" class="cap" fill="#7dd3fc">Every edge is governed, enforced, and proven</text>
    <text x="24" y="70" class="capd" style="font-size:14px">Semantics define the edges · validators fail closed on any drift · the proof ladder records provider mode, environment and freshness ·</text>
    <text x="24" y="92" class="capd" style="font-size:14px">swap Meilisearch behind the port and tenant isolation, permissions, audit and the query contract are untouched — and re-proven on demand.</text>
  </g>
</svg>
